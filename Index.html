<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Form → GitHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #eee;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.7rem;
            background: linear-gradient(90deg, #e94560, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 18px;
            border: none;
            border-radius: 10px;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 1rem;
        }
        input:focus {
            outline: 2px solid #e94560;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #e94560, #ff6b81);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.95rem;
            display: none;
        }
        .success { background: #064e3b; color: #6ee7b7; }
        .error { background: #7f1d1d; color: #fca5a5; }
        .loading { background: #1e3a8a; color: #93c5fd; }
    </style>
</head>
<body>
    <div class="card">
        <h1>King Form</h1>
        <p class="subtitle">Username & Password save to GitHub</p>

        <form id="kingForm">
            <label>Username</label>
            <input type="text" id="username" placeholder="Username" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" id="submitBtn">Save to GitHub</button>
        </form>

        <div class="status" id="status"></div>
    </div>

    <script>
        // ====================== CONFIG ======================
        const GITHUB_TOKEN = "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";   // ← yahan apna token daalo
        const REPO         = "bugflea/Priv";
        const BRANCH       = "main";
        const FOLDER       = "king-data";
        // ====================================================

        const form   = document.getElementById('kingForm');
        const status = document.getElementById('status');
        const btn    = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
                saved_from: "King Form (HTML Only)"
            };

            btn.disabled = true;
            btn.textContent = "Saving...";
            status.style.display = 'block';
            status.className = 'status loading';
            status.textContent = 'GitHub par save ho raha hai...';

            try {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const filename  = `king-${timestamp}.json`;
                const path      = FOLDER ? `\( {FOLDER}/ \){filename}` : filename;

                const content     = JSON.stringify(data, null, 2);
                const content_b64 = btoa(unescape(encodeURIComponent(content)));

                const url = `https://api.github.com/repos/\( {REPO}/contents/ \){path}`;

                const payload = {
                    message: `Auto-save from King Form • ${timestamp}`,
                    content: content_b64,
                    branch: BRANCH
                };

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (res.ok) {
                    status.className = 'status success';
                    status.innerHTML = `✅ Successfully saved!<br><small>${filename}</small>`;
                    form.reset();
                } else {
                    status.className = 'status error';
                    status.textContent = '❌ Error: ' + (result.message || 'Unknown error');
                }
            } catch (err) {
                status.className = 'status error';
                status.textContent = '❌ Network error: ' + err.message;
            }

            btn.disabled = false;
            btn.textContent = 'Save to GitHub';
        });
    </script>
</body>
</html>
